onAll("change",e=>{

  else if(a==="resp"){const rl=el.value.split(/\s*,\s*/).map(z=>z.trim()).filter(Boolean),v=rl.join(", ");if(v!==(cur.resp||""))write(id,{resp:v,resps:rl,upd:Date.now()})}

  else if(a==="st"){if((el.value||"")!==(cur.st||""))write(id,{st:el.value||"",upd:Date.now()})}
  else if(a==="etchk"||a==="etn"||a==="etd"||a==="eth"||a==="etf"||a==="etal"||a==="etr"||a==="etdesc"){
    const E=ets(cur).map(q=>Object.assign({},q)),i=+el.dataset.i;if(!E[i])return;

    else if(a==="eth")E[i].h=el.value||"";
    else if(a==="etf")E[i].hf=el.value||"";
    else if(a==="etal")E[i].al=el.value===""?null:+el.value;

const pushOk=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window&&location.protocol==="https:";

async function pushState(resave){
  const b=$("avisos");if(!b)return;
  if(!pushOk()){b.textContent="🔔 Avisos";b.dataset.st="x";return}
  const {s}=await pushSub(),on=!!s&&Notification.permission==="granted";
  b.dataset.st=on?"on":"off";b.textContent=on?"🔔 Avisos ativos ✓":"🔔 Ativar avisos neste aparelho";

    const perm=await Notification.requestPermission();
    if(perm!=="granted"){alert("As notificações estão bloqueadas. Libere nas configurações do navegador ou do aplicativo e toque de novo.");return}
    s=s||await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
    await rpc("plano_push_salvar",{p_code:code,p_nome:me,p_sub:s.toJSON()});

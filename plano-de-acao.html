<style>

header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}

.cd{background:var(--inp);border:1px solid var(--bd);border-radius:6px;min-height:92px;padding:3px;overflow:hidden}

.cc{font-size:12px;line-height:1.25;padding:2px 5px;margin-bottom:2px;border-radius:4px;background:var(--bluebg);color:#d6e4ff;border-left:3px solid var(--ac);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;user-select:none}

.cc.ok{background:var(--grnbg);color:var(--grn);border-left-color:var(--grn)}.cc.bad{background:var(--redbg);color:var(--red);border-left-color:var(--red)}.cc.warn{background:var(--ambbg);color:var(--amb);border-left-color:var(--amb)}

.cc small{display:block;opacity:.8;font-size:11px}
.mr{font-size:11px;color:var(--ac);cursor:pointer;padding:0 4px}
.cdet{margin-top:10px;border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--inp);display:grid;gap:8px}
.tray{margin-top:10px;border:1px dashed var(--bd);border-radius:10px;padding:8px}.tray .cc{display:inline-block;margin:2px 4px 2px 0;max-width:100%}

@media print{#cal,.vsw,.tpbar,.addbar{display:none}}

.tpb:hover{border-color:var(--ac)}.tpb.on{background:var(--yl);border-color:var(--yl);color:#0a2a6b}

button.chip{border:0;font:inherit;font-size:12px;font-weight:600}
.chip.est{background:#4a3a0a;color:var(--yl)}.chip.op{background:var(--bluebg);color:var(--ac)}

dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:18px;width:min(720px,calc(100vw - 24px));max-height:92vh;overflow:auto}

.tpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}

<div class="wrap">
<header>
  <div class="brand"><img src="logo-unifm.png" alt="Fastfood Milionário"><div><h1 id="h1">PLANO DE AÇÃO</h1><input id="h1i" class="h1i" aria-label="Nome da página" maxlength="120" hidden><div class="sub"><span id="sub">Tarefas, prazos e checagem</span><span class="sz" id="sz" hidden><button class="btn" type="button" id="szm" aria-label="Diminuir o nome" title="Diminuir">A−</button><button class="btn" type="button" id="szp" aria-label="Aumentar o nome" title="Aumentar">A+</button></span></div></div></div>
  <div class="row"><button class="btn pri" id="inst" type="button" hidden>📲 Instalar app</button><button class="btn" id="pdf" type="button">🖨️ Imprimir / PDF</button><button class="btn" id="logout" type="button" hidden>Sair</button></div>
</header>

<section id="gate" hidden>

    <b>Entrar no painel</b>

      <input id="gName" placeholder="Seu nome" aria-label="Seu nome" autocomplete="name">
      <input id="gCode" placeholder="Código de acesso" aria-label="Código de acesso" autocomplete="off" required>
      <button class="btn pri" type="submit" id="gBtn">Entrar</button>
    </form>
    <p id="gErr" class="err"></p>
  </div>
</section>

<main id="app" hidden>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="tpbar" id="tpbar" role="group" aria-label="Tipo de tarefa"></div>
  <div class="kpis" id="kpis"></div>
  <div class="pb"><i id="bar" style="width:0"></i></div>
  <div class="addbar"><button class="btn pri" id="newBtn" type="button" hidden>＋ Nova tarefa</button></div>
  <datalist id="team"></datalist>
  <div class="vsw" id="vsw"><button type="button" class="btn on" data-mv="list">☰ Lista</button><button type="button" class="btn" data-mv="cal">📅 Calendário</button></div>

    <div id="colL">
  <div class="filters">

    <select id="fR" aria-label="Responsável"><option value="">Todos os responsáveis</option></select>
  </div>
  <div id="list"></div>
  <div class="sub" id="foot" style="margin-top:10px"></div>
    </div>
    <aside id="colR" aria-label="Calendário"><div id="cal"></div></aside>
  </div>
</main>
</div>

<dialog id="dlg" aria-labelledby="dlgT">
  <form id="dlgF" method="dialog">
    <h2 id="dlgT" style="margin:0 0 12px;font-size:20px">Nova tarefa</h2>

      <label class="tpc"><input type="radio" name="dtp" value="e" required><span><b>🎯 Estratégica</b><small>Direção, decisões e entregas que movem os objetivos</small></span></label>
      <label class="tpc"><input type="radio" name="dtp" value="o" required><span><b>⚙️ Operacional</b><small>Execução do dia a dia e tarefas práticas</small></span></label>
    </div>
    <div style="margin-top:12px"><label class="lbl" for="dT">Nome da tarefa *</label><input id="dT" style="width:100%" placeholder="Ex.: Confeccionar o crachá" required autocomplete="off"></div>

    </div>

      <button type="button" class="btn" id="dAdd">＋ Adicionar etapa</button>

    <div class="row" style="justify-content:flex-end;margin-top:16px"><button type="button" class="btn" id="dCancel">Cancelar</button><button type="submit" class="btn pri" id="dOk">Criar tarefa</button></div>
  </form>
</dialog>

        (E.length?EO.map(o=>{const q=o.q,i=o.i;return '<div class="stp'+(q.done?' ok':'')+(!q.done&&q.d&&q.d<hoje()?' late':'')+'"><input type="checkbox" data-a="etchk" data-i="'+i+'"'+(q.done?' checked':'')+disE+' aria-label="Etapa concluída"><div class="etc"><div class="row" style="flex-wrap:wrap"><span class="sub">'+(i+1)+'.</span><input data-a="etn" data-i="'+i+'" value="'+esc(q.n||"")+'" placeholder="Nome da etapa" style="flex:1;min-width:150px;font-weight:600"'+disE+'><input data-a="etr" data-i="'+i+'" list="team" value="'+esc(q.r||"")+'" placeholder="Responsável" aria-label="Responsável pela etapa" style="width:140px" autocomplete="off"'+disE+'><input type="date" data-a="etd" data-i="'+i+'" value="'+esc(q.d||"")+'" title="Data de atuação" aria-label="Data de atuação" style="width:145px"'+disE+'>'+(canWrite?'<button type="button" data-a="etdel" data-i="'+i+'" aria-label="Excluir etapa">✕</button>':'')+'</div><textarea rows="6" class="etdesc" data-a="etdesc" data-i="'+i+'" placeholder="Descreva o que foi feito nesta etapa"'+disE+'>'+esc(q.desc||"")+'</textarea>'+(q.done?'<small>✓ Concluída'+(q.doneAt?' em '+esc(fdt(q.doneAt)):'')+(q.by?' por '+esc(q.by):'')+'</small>':'')+'</div></div>'}).join(""):'<div class="sub">Nenhuma etapa registrada.</div>')+
        '<div class="row" style="flex-wrap:wrap;margin-top:6px"><input data-a="etnew" style="flex:1;min-width:0" placeholder="Nova etapa (ex.: Pedir orçamento)" autocomplete="off"><input data-a="etnewr" list="team" placeholder="Responsável" aria-label="Responsável pela etapa" style="width:140px" autocomplete="off"><input type="date" data-a="etnewd" value="'+hoje()+'" title="Data de atuação" aria-label="Data de atuação" style="width:150px"><button class="btn pri" type="button" data-a="etadd">Adicionar etapa</button></div></div>'+
        '<div><label class="lbl">Observação</label><textarea rows="3" data-a="obstxt" placeholder="Observação"'+dis+' aria-label="Observação">'+esc(x.obs||"")+'</textarea></div></div>':'')+
      '</div>'}).join(""):'<div class="empty">'+(tot?"Nenhuma tarefa com esses filtros.":(canWrite?"Nenhuma tarefa ainda. Adicione a primeira acima.":"Nenhuma tarefa cadastrada."))+'</div>';
  if(H!==lastH){$("list").innerHTML=H;lastH=H;fitDesc()}
  $("foot").textContent=canWrite?"":"Modo checagem: você pode criar etapas, descrever e marcar. Tarefas, prazos e situação só o editor altera.";
  const nm=cfgName||"PLANO DE AÇÃO";$("h1").textContent=nm;document.title=nm;
  if(document.activeElement!==$("h1i"))$("h1i").value=nm;
  document.documentElement.style.setProperty("--hs",cfgSize+"px");$("sz").hidden=!canWrite;
  $("h1").hidden=canWrite;$("h1i").hidden=!canWrite;
  $("sub").textContent=hj?hj+" tarefa(s) vencem hoje":"Tarefas, prazos e checagem";
}
const dlg=$("dlg");
function renumN(){[...$("dEts").children].forEach((r,i)=>r.querySelector(".nn").textContent=(i+1)+".")}
function addNRow(focus){
  const d=document.createElement("div");d.className="nrow";
  d.innerHTML='<span class="sub nn"></span><input class="ne-n" placeholder="Descreva a etapa (ex.: Mapear as informações do crachá)" aria-label="Etapa" autocomplete="off"><input class="ne-r" list="team" placeholder="Responsável" aria-label="Responsável pela etapa" autocomplete="off"><input class="ne-d" type="date" aria-label="Prazo da etapa" title="Prazo da etapa"><button type="button" class="ib ne-x" aria-label="Remover etapa">✕</button>';
  $("dEts").appendChild(d);renumN();if(focus)d.querySelector(".ne-n").focus();
}
$("newBtn").addEventListener("click",()=>{
  if(!canWrite)return;$("dlgF").reset();$("dEts").innerHTML="";
  if(tpF){const r=document.querySelector('input[name=dtp][value="'+tpF+'"]');if(r)r.checked=true}
  if(typeof dlg.showModal==="function")dlg.showModal();else dlg.setAttribute("open","");
  $("dT").focus();
});
$("dAdd").addEventListener("click",()=>addNRow(true));
$("dCancel").addEventListener("click",()=>dlg.close());
$("dEts").addEventListener("click",e=>{const x=e.target.closest(".ne-x");if(x){x.closest(".nrow").remove();renumN()}});
$("dEts").addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.target.tagName!=="INPUT")return;e.preventDefault();
  const row=e.target.closest(".nrow");if(row&&row.querySelector(".ne-n").value.trim()&&row===$("dEts").lastElementChild)addNRow(true);
});
$("dlgF").addEventListener("submit",e=>{
  e.preventDefault();if(!canWrite)return;
  const tp=(document.querySelector("input[name=dtp]:checked")||{}).value,t=$("dT").value.trim();if(!tp||!t)return;
  const E=[...$("dEts").children].map(r=>({n:r.querySelector(".ne-n").value.trim(),desc:"",r:r.querySelector(".ne-r").value.trim(),d:r.querySelector(".ne-d").value||"",done:false})).filter(q=>q.n);
  const n=Date.now(),doc={pl:curPl,tp,t,due:$("dD").value||"",resp:$("dR").value.trim(),done:false,obs:"",ord:n,upd:n};
  if(E.length){doc.etapas=E;doc.eupd=n}
  if(tpF&&tpF!==tp){tpF="";try{localStorage.setItem("pa_tp","")}catch(x){}}
  write(rid(),doc,"set");dlg.close();
});
$("list").addEventListener("change",e=>{
  const el=e.target,card=el.closest(".task");if(!card||!code)return;const id=card.dataset.id,a=el.dataset.a,cur=docs[id]||{};
  if(!canWrite&&!/^et(chk|n|d|r|desc)$/.test(a))return;
  if(a==="chk")write(id,el.checked?{done:true,doneAt:Date.now(),by:me||"",upd:Date.now()}:{done:false,doneAt:0,by:"",upd:Date.now()});
  else if(a==="t"){const v=el.value.trim();if(!v){render();return}if(v!==cur.t)write(id,{t:v,upd:Date.now()})}
  else if(a==="due"){if((el.value||"")!==(cur.due||""))write(id,{due:el.value||"",upd:Date.now()})}
  else if(a==="resp"){const v=el.value.trim();if(v!==(cur.resp||""))write(id,{resp:v,upd:Date.now()})}
  else if(a==="st"){if((el.value||"")!==(cur.st||""))write(id,{st:el.value||"",upd:Date.now()})}
  else if(a==="etchk"||a==="etn"||a==="etd"||a==="etr"||a==="etdesc"){
    const E=ets(cur).map(q=>Object.assign({},q)),i=+el.dataset.i;if(!E[i])return;
    if(a==="etchk"){E[i].done=el.checked;E[i].doneAt=el.checked?Date.now():0;E[i].by=el.checked?(me||""):""}
    else if(a==="etn")E[i].n=el.value.trim();
    else if(a==="etd")E[i].d=el.value||"";
    else if(a==="etr")E[i].r=el.value.trim();
    else E[i].desc=el.value.trim();
    saveEts(id,E)}
  else if(a==="obstxt"){const v=el.value.trim();if(v!==(cur.obs||""))write(id,{obs:v,upd:Date.now()})}
});
function addEt(card){
  if(!code||!card)return;const inp=card.querySelector('[data-a="etnew"]'),v=inp?inp.value.trim():"";if(!v)return;
  const id=card.dataset.id,d=(card.querySelector('[data-a="etnewd"]')||{}).value||hoje(),rr=((card.querySelector('[data-a="etnewr"]')||{}).value||"").trim();
  inp.value="";saveEts(id,ets(docs[id]||{}).concat([{n:v,desc:"",r:rr,d,done:false}]));
}
$("list").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&(e.target.dataset.a==="etnew"||e.target.dataset.a==="etnewd"||e.target.dataset.a==="etnewr")){e.preventDefault();addEt(e.target.closest(".task"));e.target.blur()}});
let delArm=null;
$("list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;const id=b.closest(".task").dataset.id;
  if(b.dataset.a==="obs"){openObs[id]=!openObs[id];render();if(openObs[id]){const t=document.querySelector('.task[data-id="'+id+'"] textarea');if(t)t.focus()}}
  else if(b.dataset.a==="tp"){if(!canWrite)return;const c=docs[id]||{};write(id,{tp:(c.tp==="e")?"o":"e",upd:Date.now()})}
  else if(b.dataset.a==="etadd"){addEt(b.closest(".task"))}
  else if(b.dataset.a==="etdel"){if(!canWrite)return;if(!confirm("Excluir esta etapa do histórico?"))return;saveEts(id,ets(docs[id]||{}).filter((_,i)=>i!==+b.dataset.i))}
  else if(b.dataset.a==="del"){
    if(delArm&&delArm.id===id){clearTimeout(delArm.t);delArm=null;del(id);return}
    if(delArm)clearTimeout(delArm.t);
    b.textContent="Excluir?";b.classList.add("danger");
    delArm={id,t:setTimeout(()=>{delArm=null;b.textContent="🗑";b.classList.remove("danger")},3000)};
  }
});
$("list").addEventListener("input",e=>{if(e.target.classList&&e.target.classList.contains("etdesc"))fitDesc(e.target.parentNode)});
document.addEventListener("focusout",()=>{if(pend)setTimeout(render,0)});
["q","fS","fR"].forEach(i=>$(i).addEventListener("input",render));
$("h1i").addEventListener("change",async()=>{
  const v=$("h1i").value.trim();if(!canWrite)return;if(!v){$("h1i").value=cfgName||"PLANO DE AÇÃO";return}
  if(v===(cfgName||"PLANO DE AÇÃO"))return;cfgName=v;writing++;
  try{await rpc("painel_gravar",{p_code:code,p_col:"meta",p_id:"pacfg",p_dados:{name:v,upd:Date.now()},p_modo:"update"})}catch(e){alert("Não consegui salvar o nome.")}
  finally{writing--;poll()}render()});
async function setSize(d){
  if(!canWrite)return;const n=Math.min(80,Math.max(14,cfgSize+d));if(n===cfgSize)return;cfgSize=n;render();writing++;
  try{await rpc("painel_gravar",{p_code:code,p_col:"meta",p_id:"pacfg",p_dados:{size:n,upd:Date.now()},p_modo:"update"})}catch(e){alert("Não consegui salvar o tamanho.")}
  finally{writing--;poll()}}
$("szm").addEventListener("click",()=>setSize(-4));$("szp").addEventListener("click",()=>setSize(4));
$("h1i").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()});
$("pdf").addEventListener("click",()=>window.print());
function setLock(on){$("gate").hidden=!on;$("app").hidden=on;$("logout").hidden=on}
function logout(msg){lastH="";code="";lsSet("pe_code","");clearInterval(pollT);docs={};canWrite=false;setLock(true);$("gErr").textContent=msg||""}
async function login(c,name,silent){
  c=normCode(c);$("gBtn").disabled=true;$("gErr").textContent="";
  try{
    const r=await rpc("painel_ler",{p_code:c});
    code=c;me=name||lsGet("pe_name")||"Alguém";canWrite=r.papel==="editor";load(r);
    lsSet("pe_code",c);lsSet("pe_name",name||"");setLock(false);render();
    clearInterval(pollT);pollT=setInterval(()=>{if(!document.hidden)poll()},8000);
  }catch(e){
    if(e.msg==="codigo_invalido"){lsSet("pe_code","");$("gErr").textContent=silent?"":"Código inválido. Confira e tente de novo."}
    else $("gErr").textContent="Não consegui falar com o banco. Verifique a internet e tente de novo.";
    setLock(true);
  }finally{$("gBtn").disabled=false}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()});
$("gForm").addEventListener("submit",e=>{e.preventDefault();login($("gCode").value,$("gName").value.trim())});
$("logout").addEventListener("click",()=>logout(""));
$("gName").value=lsGet("pe_name");setLock(true);
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("plano-sw.js",{scope:"./plano-de-acao.html"}).catch(()=>{});
let instEv=null;
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
if(!standalone())$("inst").hidden=false;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();instEv=e});
window.addEventListener("appinstalled",()=>{$("inst").hidden=true;instEv=null});
$("inst").addEventListener("click",async()=>{
  if(instEv){instEv.prompt();try{await instEv.userChoice}catch(e){}instEv=null;return}
  const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua),inapp=/FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)/.test(ua);
  alert(inapp?"Você abriu o link dentro de outro aplicativo (WhatsApp, Instagram…). Abra este endereço no Chrome (Android) ou no Safari (iPhone) e toque em Instalar app de novo."
   :ios?"No iPhone: toque no botão Compartilhar (quadrado com seta) do Safari e escolha \"Adicionar à Tela de Início\"."
   :"Abra o menu do navegador (⋮ no Chrome) e escolha \"Instalar aplicativo\" ou \"Adicionar à tela inicial\". No computador, use o ícone de instalar na barra de endereço.");
});
const c0=lsGet("pe_code");if(c0)login(c0,lsGet("pe_name"),true);

<!doctype html>

<style>

header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}

.brand>div{min-width:0;flex:1}
.sz{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}

h1{font-size:var(--hs,22px);margin:0;letter-spacing:.02em;line-height:1.15;overflow-wrap:anywhere}

.sub{color:var(--mut);font-size:13px}
.btn{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--yl);border-color:var(--yl);color:#0a2a6b;font-weight:700}

input,select,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--inp);color:var(--tx);max-width:100%;min-width:0}
textarea{width:100%;resize:vertical}

.notice{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:12px;padding:12px;margin-bottom:14px}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

.tab:hover{color:var(--tx);border-color:var(--ac)}
.tab.on{background:var(--yl);border-color:var(--yl);color:#0a2a6b}

.tab small{font-weight:400;opacity:.8}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--kc,var(--yl));border-radius:12px;padding:12px}
.k small{display:block;font-size:13px;font-weight:600;opacity:.92}
.k b{display:block;font-size:34px;line-height:1.1;margin-top:2px;font-weight:800;font-variant-numeric:tabular-nums}
.pb{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:0 0 14px}
.pb i{display:block;height:100%;background:var(--grn);transition:width .3s}
.add{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:1fr 160px 170px auto;gap:8px;align-items:end}
.add label,.lbl{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.add .btn{height:38px}
@media (max-width:720px){.add{grid-template-columns:1fr 1fr}.add .t{grid-column:1/-1}.add .btn{grid-column:1/-1}}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters input{flex:1;min-width:150px}
.task{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.task.late{border-left-color:var(--red)}.task.today{border-left-color:var(--amb)}.task.done{border-left-color:var(--grn)}
.task.done .ti{text-decoration:line-through;opacity:.7}

.top input[type=checkbox]{width:24px;height:24px;accent-color:#12b76a;cursor:pointer}
.ti{width:100%;font-weight:600;font-size:15px;background:transparent;border-color:transparent}
.ti:hover,.ti:focus{border-color:var(--bd);background:var(--inp)}
.acts{display:flex;gap:4px}
.ib{font:inherit;border:1px solid var(--bd);background:transparent;color:var(--mut);border-radius:8px;padding:6px 9px;cursor:pointer}
.ib:hover{color:var(--tx);border-color:var(--ac)}
.ib.on{color:var(--yl);border-color:var(--yl)}
.meta{margin:6px 0 0 32px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--bluebg);color:var(--ac);font-weight:600;white-space:nowrap}
.chip.ok{background:var(--grnbg);color:var(--grn)}.chip.bad{background:var(--redbg);color:var(--red)}.chip.warn{background:var(--ambbg);color:var(--amb)}
.obs{margin:8px 0 0 32px;border-top:1px solid var(--bd);padding-top:10px;display:grid;gap:10px}
.etb{display:flex;gap:8px;align-items:center;width:calc(100% - 32px);margin:8px 0 0 32px;text-align:left;font:inherit;font-size:14px;color:var(--tx);background:var(--inp);border:1px dashed var(--bd);border-radius:8px;padding:7px 10px;cursor:pointer}
.etb:hover{border-color:var(--ac)}.etb .et{flex:1;min-width:0;overflow-wrap:anywhere}.etb i{color:var(--mut)}
.stp{display:flex;gap:10px;align-items:flex-start;padding:8px;margin-bottom:6px;background:var(--inp);border:1px solid var(--bd);border-left:4px solid var(--bd);border-radius:8px;font-size:14px}
.stp.late{border-left-color:var(--red)}.stp.ok{border-left-color:var(--grn)}.stp.ok input[data-a=etn]{text-decoration:line-through;opacity:.75}
.stp>input[type=checkbox]{width:22px;height:22px;margin-top:6px;accent-color:#12b76a;cursor:pointer}
.etc{flex:1;min-width:0;display:grid;gap:6px}.stp small{color:var(--grn);font-size:12px}
.stp button{border:0;background:transparent;color:var(--mut);cursor:pointer;font-size:15px;padding:0 4px}
.empty{text-align:center;color:var(--mut);padding:30px 10px;border:1px dashed var(--bd);border-radius:12px}
@media (max-width:720px){.top{grid-template-columns:auto 1fr auto}.top .d,.top .r{grid-column:2/-1}.meta,.obs{margin-left:0}.etb{margin-left:0;width:100%}}
#gate[hidden],[hidden]{display:none!important}
.err{color:var(--red);margin-top:8px}
@media print{body::before{display:none}body{background:#fff;color:#000}.add,.filters,.acts,#logout,#pdf{display:none}.task{border-color:#999;background:#fff;color:#000}.k{background:#fff;border-color:#999}}
</style></head><body>
<div class="wrap">
<header>
  <div class="brand"><img src="logo-unifm.png" alt="Fastfood Milionário"><div><h1 id="h1">PLANO DE AÇÃO</h1><input id="h1i" class="h1i" aria-label="Nome da página" maxlength="120" hidden><div class="sub"><span id="sub">Tarefas, prazos e checagem</span><span class="sz" id="sz" hidden><button class="btn" type="button" id="szm" aria-label="Diminuir o nome" title="Diminuir">A−</button><button class="btn" type="button" id="szp" aria-label="Aumentar o nome" title="Aumentar">A+</button></span></div></div></div>
  <div class="row"><button class="btn" id="pdf" type="button">🖨️ Imprimir / PDF</button><button class="btn" id="logout" type="button" hidden>Sair</button></div>
</header>

<section id="gate" hidden>
  <div class="notice">
    <b>Entrar no painel</b>
    <p>Digite seu nome e o código de acesso da equipe (o mesmo do painel de execução).</p>
    <form id="gForm" class="row" style="margin-top:10px">
      <input id="gName" placeholder="Seu nome" aria-label="Seu nome" autocomplete="name">
      <input id="gCode" placeholder="Código de acesso" aria-label="Código de acesso" autocomplete="off" required>
      <button class="btn pri" type="submit" id="gBtn">Entrar</button>
    </form>
    <p id="gErr" class="err"></p>
  </div>
</section>

<main id="app" hidden>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="kpis" id="kpis"></div>
  <div class="pb"><i id="bar" style="width:0"></i></div>
  <form class="add" id="addF" hidden>
    <div class="t"><label for="nT">Nova tarefa</label><input id="nT" style="width:100%" placeholder="O que precisa ser feito?" autocomplete="off" required></div>
    <div><label for="nD">Prazo final</label><input id="nD" type="date" style="width:100%"></div>
    <div><label for="nR">Responsável</label><input id="nR" list="team" style="width:100%" autocomplete="off"></div>
    <button class="btn pri" type="submit">Adicionar</button>
  </form>
  <datalist id="team"></datalist>
  <div class="filters">
    <input id="q" placeholder="Buscar tarefa ou responsável" aria-label="Buscar">
    <select id="fS" aria-label="Situação"><option value="">Todas</option><option value="p">Pendentes</option><option value="l">Atrasadas</option><option value="c">Concluídas</option></select>
    <select id="fR" aria-label="Responsável"><option value="">Todos os responsáveis</option></select>
  </div>
  <div id="list"></div>
  <div class="sub" id="foot" style="margin-top:10px"></div>
</main>
</div>

<script>
const SB_URL="https://dqdlnywyiiuaeqvpkuek.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxZGxueXd5aWl1YWVxdnBrdWVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MTQ5MDUsImV4cCI6MjEwNzk5MDkwNX0.x4GgQf6dH30wH-7k01S_REOOqA8uQUIBJ5NHWeA6WlM";
</script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P="pa_";
let lastH="",curPl=lsPl(),cfgPlans=[{id:"p1",name:"FACULDADE 100%"},{id:"p2",name:"Plano 2"}],cfgName="",cfgSize=22,code="",me="",canWrite=false,docs={},writing=0,pollT=null,sig="",openObs={},pend=false;
function lsPl(){try{return localStorage.getItem("pa_plan")||"p1"}catch(e){return"p1"}}
const lsGet=k=>{try{return localStorage.getItem(k)||""}catch(e){return""}};
const lsSet=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};
function rpc(fn,args){
  return fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(args)})
   .then(async r=>{const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
     if(!r.ok){const e=new Error((j&&j.message)||String(r.status));e.msg=(j&&j.message)||"";throw e}
     return j});
}
const normCode=v=>String(v||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g,"").toLowerCase();
const hoje=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?m[3]+"/"+m[2]+"/"+m[1]:"sem data"};
const fdt=(ms,y)=>{if(!ms)return"";const d=new Date(ms);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+(y?"/"+d.getFullYear():"")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const dias=(a,b)=>Math.round((Date.parse(b+"T12:00:00")-Date.parse(a+"T12:00:00"))/864e5);
function load(r){const c=(r.docs||[]).find(d=>d.col==="meta"&&d.id==="pacfg");cfgName=c&&c.data&&c.data.name?String(c.data.name):"";cfgPlans=c&&c.data&&Array.isArray(c.data.plans)&&c.data.plans.length?c.data.plans:[{id:"p1",name:"FACULDADE 100%"},{id:"p2",name:"Plano 2"}];if(!cfgPlans.some(q=>q.id===curPl))curPl=cfgPlans[0].id;cfgSize=c&&c.data&&+c.data.size?Math.min(80,Math.max(14,+c.data.size)):22;const n={};(r.docs||[]).forEach(d=>{if(d.col==="meta"&&d.id.indexOf(P)===0)n[d.id.slice(P.length)]=d.data});docs=n}
async function write(id,patch,modo){
  if(!canWrite)return;writing++;
  try{
    docs[id]=modo==="set"||!docs[id]?patch:Object.assign({},docs[id],patch);render();
    await rpc("painel_gravar",{p_code:code,p_col:"meta",p_id:P+id,p_dados:patch,p_modo:modo||"update"});
  }catch(e){alert("Não consegui salvar. Verifique a internet e tente de novo.")}
  finally{writing--;poll()}
}
async function del(id){
  if(!canWrite)return;writing++;
  try{delete docs[id];render();await rpc("painel_excluir",{p_code:code,p_col:"meta",p_id:P+id})}
  catch(e){alert("Não consegui excluir.")}
  finally{writing--;poll()}
}
async function poll(){
  if(writing>0||!code)return;
  try{
    const r=await rpc("painel_ler",{p_code:code});if(writing>0)return;
    const w=r.papel==="editor";load(r);
    if(w!==canWrite){canWrite=w;render();return}
    render();
  }catch(e){if(e.msg==="codigo_invalido")logout("O código de acesso mudou. Entre de novo.")}
}
function rid(){return"a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ets(x){return Array.isArray(x.etapas)?x.etapas:((x.etapa||"").trim()?[{n:x.etapa.trim(),desc:"",d:"",done:false}]:[])}
async function saveEts(id,E){
  if(!code)return;const n=Date.now();writing++;
  try{docs[id]=Object.assign({},docs[id],{etapas:E,etapa:"",eupd:n,upd:n});render();
    await rpc("plano_etapas",{p_code:code,p_id:P+id,p_etapas:E})}
  catch(e){alert("Não consegui salvar a etapa. Verifique a internet e tente de novo.")}
  finally{writing--;poll()}}
const lastUp=x=>ets(x).length?(x.eupd||x.upd||0):0;
function renderTabs(){
  const a=document.activeElement;if(a&&a.classList&&a.classList.contains("tab")&&a.tagName==="INPUT")return;
  const cnt={};Object.keys(docs).forEach(id=>{const k=docs[id].pl||"p1";cnt[k]=(cnt[k]||0)+1});
  $("tabs").innerHTML=cfgPlans.map(q=>q.id===curPl&&canWrite
    ?'<input class="tab on" data-pl="'+esc(q.id)+'" value="'+esc(q.name)+'" size="'+Math.max(8,q.name.length+2)+'" maxlength="40" aria-label="Nome da aba (clique para renomear)" title="Clique para renomear">'
    :'<button type="button" class="tab'+(q.id===curPl?' on':'')+'" role="tab" aria-selected="'+(q.id===curPl)+'" data-pl="'+esc(q.id)+'">'+esc(q.name)+' <small>('+(cnt[q.id]||0)+')</small></button>').join("");
}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-pl]");if(!b)return;curPl=b.dataset.pl;try{localStorage.setItem("pa_plan",curPl)}catch(x){}lastH="";openObs={};render()});
$("tabs").addEventListener("input",e=>{if(e.target.tagName==="INPUT")e.target.size=Math.max(8,e.target.value.length+2)});
$("tabs").addEventListener("change",async e=>{
  const i=e.target;if(i.tagName!=="INPUT"||!canWrite)return;const v=i.value.trim();
  if(!v){i.value=(cfgPlans.find(q=>q.id===i.dataset.pl)||{}).name||"";return}
  cfgPlans=cfgPlans.map(q=>q.id===i.dataset.pl?Object.assign({},q,{name:v}):q);writing++;
  try{await rpc("painel_gravar",{p_code:code,p_col:"meta",p_id:"pacfg",p_dados:{plans:cfgPlans,upd:Date.now()},p_modo:"update"})}catch(x){alert("Não consegui salvar o nome da aba.")}
  finally{writing--;poll()}render()});
$("tabs").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT")e.target.blur()});
function list(){
  const t=hoje();
  return Object.keys(docs).map(id=>Object.assign({id},docs[id])).map(x=>{
    x.late=!x.done&&!!x.due&&x.due<t;x.today=!x.done&&x.due===t;return x}).filter(x=>(x.pl||"p1")===curPl);
}
function render(){
  if(!code)return;
  const a=document.activeElement;
  if(a&&$("list").contains(a)&&/INPUT|TEXTAREA/.test(a.tagName)&&a.type!=="checkbox"){pend=true;return}
  pend=false;
  renderTabs();
  const all=list(),tot=all.length,dn=all.filter(x=>x.done).length,lt=all.filter(x=>x.late).length,hj=all.filter(x=>x.today).length,pc=tot?Math.round(100*dn/tot):0;
  $("kpis").innerHTML=
   '<div class="k" style="--kc:#8db4ff"><small>Total</small><b>'+tot+'</b></div>'+
   '<div class="k" style="--kc:#12b76a"><small>Concluídas</small><b>'+dn+'</b></div>'+
   '<div class="k" style="--kc:#ffac03"><small>Pendentes</small><b>'+(tot-dn)+'</b></div>'+
   '<div class="k" style="--kc:#ff8a80"><small>Atrasadas</small><b>'+lt+'</b></div>'+
   '<div class="k" style="--kc:#12b76a"><small>Progresso</small><b>'+pc+'%</b></div>';
  $("bar").style.width=pc+"%";
  $("addF").hidden=!canWrite;
  const names=[...new Set(all.map(x=>(x.resp||"").trim()).filter(Boolean))].sort((x,y)=>x.localeCompare(y,"pt-BR"));
  $("team").innerHTML=names.map(n=>'<option value="'+esc(n)+'">').join("");
  const fr=$("fR"),cv=fr.value;
  fr.innerHTML='<option value="">Todos os responsáveis</option>'+names.map(n=>'<option'+(n===cv?" selected":"")+' value="'+esc(n)+'">'+esc(n)+'</option>').join("");
  const q=$("q").value.trim().toLowerCase(),fs=$("fS").value,rs=fr.value;
  let L=all.filter(x=>{
    if(fs==="p"&&x.done)return false;if(fs==="c"&&!x.done)return false;if(fs==="l"&&!x.late)return false;
    if(rs&&(x.resp||"").trim()!==rs)return false;
    if(q&&!((x.t||"")+" "+(x.resp||"")).toLowerCase().includes(q))return false;return true});
  L.sort((x,y)=>(x.done?1:0)-(y.done?1:0)||lastUp(y)-lastUp(x)||(y.ord||0)-(x.ord||0));
  const dis=canWrite?"":" disabled",disE=code?"":" disabled";
  const H=L.length?L.map(x=>{
    const cls=x.done?" done":x.late?" late":x.today?" today":"";
    let chip;
    if(x.done)chip='<span class="chip ok">✓ Concluída'+(x.doneAt?" em "+esc(fdt(x.doneAt)):"")+(x.by?" por "+esc(x.by):"")+'</span>';
    else if(x.late)chip='<span class="chip bad">Atrasada '+dias(x.due,hoje())+' dia(s)</span>';
    else if(x.today)chip='<span class="chip warn">Vence hoje</span>';
    else if(x.due)chip='<span class="chip">Faltam '+dias(hoje(),x.due)+' dia(s)</span>';
    else chip='<span class="chip">Sem data</span>';
    const SX={and:["Em andamento","chip"],agu:["Aguardando","chip warn"],par:["Parada","chip bad"]};
    const E=ets(x),nd=E.filter(q=>q.done).length,EO=E.map((q,i)=>({q,i})).sort((m,n)=>(m.q.d||"9999").localeCompare(n.q.d||"9999")||m.i-n.i),cu=EO.findIndex(o=>!o.q.done),cq=cu<0?null:EO[cu].q;
    const hasO=!!((x.obs||"").trim()||E.length||x.st),op=openObs[x.id]||false;
    const sit=!x.done&&x.st&&SX[x.st]?'<span class="'+SX[x.st][1]+'">'+SX[x.st][0]+'</span>':"";
    const barTx=!E.length?'<i>'+(code?"Registrar etapas e andamento":"Sem etapas registradas")+'</i>':(cu<0?"✅ <b>Todas as etapas concluídas</b>":"📍 <b>Etapa atual:</b> "+esc(cq.n||"(sem nome)")+(cq.d?' <span class="sub">· '+esc(fd(cq.d))+(cq.d<hoje()?' · <b style="color:var(--red)">atrasada</b>':cq.d===hoje()?' · <b style="color:var(--amb)">hoje</b>':"")+"</span>":""));
    return '<div class="task'+cls+'" data-id="'+esc(x.id)+'"><div class="top">'+
      '<input type="checkbox" data-a="chk"'+(x.done?" checked":"")+dis+' aria-label="Marcar como realizada">'+
      '<input class="ti" data-a="t" value="'+esc(x.t)+'" aria-label="Tarefa"'+dis+'>'+
      '<input class="d" type="date" data-a="due" value="'+esc(x.due||"")+'" aria-label="Prazo final" title="Prazo final do checklist"'+dis+'>'+
      '<input class="r" data-a="resp" list="team" value="'+esc(x.resp||"")+'" placeholder="Responsável" aria-label="Responsável" autocomplete="off"'+dis+'>'+
      '<div class="acts"><button class="ib'+(hasO||op?" on":"")+'" type="button" data-a="obs" title="Andamento e observação" aria-label="Andamento e observação">📝</button>'+(canWrite?'<button class="ib" type="button" data-a="del" title="Excluir" aria-label="Excluir tarefa">🗑</button>':'')+'</div></div>'+
      '<div class="meta">'+chip+sit+'<span class="sub">📅 <b>Prazo final:</b> '+esc(fd(x.due))+'</span><span class="sub">🔄 <b>Última atualização:</b> '+(lastUp(x)?esc(fdt(lastUp(x),1)):'sem etapa')+'</span></div>'+
      '<button type="button" class="etb" data-a="obs" aria-expanded="'+op+'"><span class="ar">'+(op?'▾':'▸')+'</span><span class="et">'+barTx+'</span>'+(E.length?'<span class="sub">'+nd+'/'+E.length+' etapas</span>':'')+'</button>'+
      (op?'<div class="obs"><div style="max-width:240px"><label class="lbl">Situação</label><select data-a="st" style="width:100%"'+dis+'><option value="">Não informada</option><option value="and"'+(x.st==="and"?" selected":"")+'>Em andamento</option><option value="agu"'+(x.st==="agu"?" selected":"")+'>Aguardando</option><option value="par"'+(x.st==="par"?" selected":"")+'>Parada</option></select></div>'+
        '<div><label class="lbl">Etapas (ordenadas pela data de atuação; marque quando a etapa for concluída)</label>'+
        (E.length?EO.map(o=>{const q=o.q,i=o.i;return '<div class="stp'+(q.done?' ok':'')+(!q.done&&q.d&&q.d<hoje()?' late':'')+'"><input type="checkbox" data-a="etchk" data-i="'+i+'"'+(q.done?' checked':'')+disE+' aria-label="Etapa concluída"><div class="etc"><div class="row" style="flex-wrap:nowrap"><span class="sub">'+(i+1)+'.</span><input data-a="etn" data-i="'+i+'" value="'+esc(q.n||"")+'" placeholder="Nome da etapa" style="flex:1;font-weight:600"'+disE+'><input type="date" data-a="etd" data-i="'+i+'" value="'+esc(q.d||"")+'" title="Data de atuação" aria-label="Data de atuação" style="width:145px"'+disE+'>'+(canWrite?'<button type="button" data-a="etdel" data-i="'+i+'" aria-label="Excluir etapa">✕</button>':'')+'</div><textarea rows="2" data-a="etdesc" data-i="'+i+'" placeholder="Descreva o que foi feito nesta etapa"'+disE+'>'+esc(q.desc||"")+'</textarea>'+(q.done?'<small>✓ Concluída'+(q.doneAt?' em '+esc(fdt(q.doneAt)):'')+(q.by?' por '+esc(q.by):'')+'</small>':'')+'</div></div>'}).join(""):'<div class="sub">Nenhuma etapa registrada.</div>')+
        '<div class="row" style="flex-wrap:wrap;margin-top:6px"><input data-a="etnew" style="flex:1;min-width:0" placeholder="Nova etapa (ex.: Pedir orçamento)" autocomplete="off"><input type="date" data-a="etnewd" value="'+hoje()+'" title="Data de atuação" aria-label="Data de atuação" style="width:150px"><button class="btn pri" type="button" data-a="etadd">Adicionar etapa</button></div></div>'+
        '<div><label class="lbl">Observação</label><textarea rows="3" data-a="obstxt" placeholder="Observação"'+dis+' aria-label="Observação">'+esc(x.obs||"")+'</textarea></div></div>':'')+
      '</div>'}).join(""):'<div class="empty">'+(tot?"Nenhuma tarefa com esses filtros.":(canWrite?"Nenhuma tarefa ainda. Adicione a primeira acima.":"Nenhuma tarefa cadastrada."))+'</div>';
  if(H!==lastH){$("list").innerHTML=H;lastH=H}
  $("foot").textContent=canWrite?"":"Modo checagem: você pode criar etapas, descrever e marcar. Tarefas, prazos e situação só o editor altera.";
  const nm=cfgName||"PLANO DE AÇÃO";$("h1").textContent=nm;document.title=nm;
  if(document.activeElement!==$("h1i"))$("h1i").value=nm;
  document.documentElement.style.setProperty("--hs",cfgSize+"px");$("sz").hidden=!canWrite;
  $("h1").hidden=canWrite;$("h1i").hidden=!canWrite;
  $("sub").textContent=hj?hj+" tarefa(s) vencem hoje":"Tarefas, prazos e checagem";
}
$("addF").addEventListener("submit",e=>{
  e.preventDefault();const t=$("nT").value.trim();if(!t||!canWrite)return;
  write(rid(),{pl:curPl,t,due:$("nD").value||"",resp:$("nR").value.trim(),done:false,obs:"",ord:Date.now(),upd:Date.now()},"set");
  $("nT").value="";$("nT").focus();
});
$("list").addEventListener("change",e=>{
  const el=e.target,card=el.closest(".task");if(!card||!code)return;const id=card.dataset.id,a=el.dataset.a,cur=docs[id]||{};
  if(!canWrite&&!/^et(chk|n|d|desc)$/.test(a))return;
  if(a==="chk")write(id,el.checked?{done:true,doneAt:Date.now(),by:me||"",upd:Date.now()}:{done:false,doneAt:0,by:"",upd:Date.now()});
  else if(a==="t"){const v=el.value.trim();if(!v){render();return}if(v!==cur.t)write(id,{t:v,upd:Date.now()})}
  else if(a==="due"){if((el.value||"")!==(cur.due||""))write(id,{due:el.value||"",upd:Date.now()})}
  else if(a==="resp"){const v=el.value.trim();if(v!==(cur.resp||""))write(id,{resp:v,upd:Date.now()})}
  else if(a==="st"){if((el.value||"")!==(cur.st||""))write(id,{st:el.value||"",upd:Date.now()})}
  else if(a==="etchk"||a==="etn"||a==="etd"||a==="etdesc"){
    const E=ets(cur).map(q=>Object.assign({},q)),i=+el.dataset.i;if(!E[i])return;
    if(a==="etchk"){E[i].done=el.checked;E[i].doneAt=el.checked?Date.now():0;E[i].by=el.checked?(me||""):""}
    else if(a==="etn")E[i].n=el.value.trim();
    else if(a==="etd")E[i].d=el.value||"";
    else E[i].desc=el.value.trim();
    saveEts(id,E)}
  else if(a==="obstxt"){const v=el.value.trim();if(v!==(cur.obs||""))write(id,{obs:v,upd:Date.now()})}
});
function addEt(card){
  if(!code||!card)return;const inp=card.querySelector('[data-a="etnew"]'),v=inp?inp.value.trim():"";if(!v)return;
  const id=card.dataset.id,d=(card.querySelector('[data-a="etnewd"]')||{}).value||hoje();
  inp.value="";saveEts(id,ets(docs[id]||{}).concat([{n:v,desc:"",d,done:false}]));
}
$("list").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&(e.target.dataset.a==="etnew"||e.target.dataset.a==="etnewd")){e.preventDefault();addEt(e.target.closest(".task"));e.target.blur()}});
let delArm=null;
$("list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;const id=b.closest(".task").dataset.id;
  if(b.dataset.a==="obs"){openObs[id]=!openObs[id];render();if(openObs[id]){const t=document.querySelector('.task[data-id="'+id+'"] textarea');if(t)t.focus()}}
  else if(b.dataset.a==="etadd"){addEt(b.closest(".task"))}
  else if(b.dataset.a==="etdel"){if(!canWrite)return;if(!confirm("Excluir esta etapa do histórico?"))return;saveEts(id,ets(docs[id]||{}).filter((_,i)=>i!==+b.dataset.i))}
  else if(b.dataset.a==="del"){
    if(delArm&&delArm.id===id){clearTimeout(delArm.t);delArm=null;del(id);return}
    if(delArm)clearTimeout(delArm.t);
    b.textContent="Excluir?";b.classList.add("danger");
    delArm={id,t:setTimeout(()=>{delArm=null;b.textContent="🗑";b.classList.remove("danger")},3000)};
  }
});
document.addEventListener("focusout",()=>{if(pend)setTimeout(render,0)});
["q","fS","fR"].forEach(i=>$(i).addEventListener("input",render));
$("h1i").addEventListener("change",async()=>{
  const v=$("h1i").value.trim();if(!canWrite)return;if(!v){$("h1i").value=cfgName||"PLANO DE AÇÃO";return}
  if(v===(cfgName||"PLANO DE AÇÃO"))return;cfgName=v;writing++;
  try{await rpc("painel_gravar",{p_code:code,p_col:"meta",p_id:"pacfg",p_dados:{name:v,upd:Date.now()},p_modo:"update"})}catch(e){alert("Não consegui salvar o nome.")}
  finally{writing--;poll()}render()});
async function setSize(d){
  if(!canWrite)return;const n=Math.min(80,Math.max(14,cfgSize+d));if(n===cfgSize)return;cfgSize=n;render();writing++;
  try{await rpc("painel_gravar",{p_code:code,p_col:"meta",p_id:"pacfg",p_dados:{size:n,upd:Date.now()},p_modo:"update"})}catch(e){alert("Não consegui salvar o tamanho.")}
  finally{writing--;poll()}}
$("szm").addEventListener("click",()=>setSize(-4));$("szp").addEventListener("click",()=>setSize(4));
$("h1i").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()});
$("pdf").addEventListener("click",()=>window.print());
function setLock(on){$("gate").hidden=!on;$("app").hidden=on;$("logout").hidden=on}
function logout(msg){lastH="";code="";lsSet("pe_code","");clearInterval(pollT);docs={};canWrite=false;setLock(true);$("gErr").textContent=msg||""}
async function login(c,name,silent){
  c=normCode(c);$("gBtn").disabled=true;$("gErr").textContent="";
  try{
    const r=await rpc("painel_ler",{p_code:c});
    code=c;me=name||lsGet("pe_name")||"Alguém";canWrite=r.papel==="editor";load(r);
    lsSet("pe_code",c);lsSet("pe_name",name||"");setLock(false);render();
    clearInterval(pollT);pollT=setInterval(()=>{if(!document.hidden)poll()},8000);
  }catch(e){
    if(e.msg==="codigo_invalido"){lsSet("pe_code","");$("gErr").textContent=silent?"":"Código inválido. Confira e tente de novo."}
    else $("gErr").textContent="Não consegui falar com o banco. Verifique a internet e tente de novo.";
    setLock(true);
  }finally{$("gBtn").disabled=false}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()});
$("gForm").addEventListener("submit",e=>{e.preventDefault();login($("gCode").value,$("gName").value.trim())});
$("logout").addEventListener("click",()=>logout(""));
$("gName").value=lsGet("pe_name");setLock(true);
const c0=lsGet("pe_code");if(c0)login(c0,lsGet("pe_name"),true);
</script>
</body></html>
